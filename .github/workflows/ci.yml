name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "not formatted; run: just fmt"; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

      # The example fixtures are load-bearing: the docs quote their output.
      - name: validate catalog and fleet
        run: |
          go run ./cmd/exclave validate \
            -catalog examples/quickstart/catalog \
            -fleet examples/quickstart/fleet/environments

      - name: plan
        run: |
          go run ./cmd/exclave plan \
            -catalog examples/quickstart/catalog \
            -fleet examples/quickstart/fleet/environments

      # The contract portfolio is a second fixture set with the compliance
      # constraints exercised. The docs quote its output, so CI runs it.
      - name: portfolio plan
        run: |
          go run ./cmd/exclave validate \
            -catalog examples/contracts/catalog \
            -fleet examples/contracts/fleet/contracts
          go run ./cmd/exclave plan \
            -catalog examples/contracts/catalog \
            -fleet examples/contracts/fleet/contracts

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: lint charts
        run: |
          # Depth-first: svc must vendor `common` before product packages svc.
          helm dependency update examples/quickstart/charts/svc
          helm dependency update examples/quickstart/charts/product
          helm lint examples/quickstart/charts/product

      # The contract plane is only real if the schema enforces it. Same script
      # the Justfile and GitLab CI run, so the pipelines cannot drift apart.
      - name: contract check
        run: ./ci/contract-check.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # "Cloud-agnostic" is a claim; this is what makes it a tested one.
      - name: landing zone interface parity
        run: ./ci/landing-zone-check.sh

      # Ceiling, signed manifest and redaction. These fail silently in the real
      # world, so they are asserted rather than trusted.
      - name: portfolio controls
        run: ./ci/portfolio-check.sh
