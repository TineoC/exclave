{{- define "common.deployment" -}}
{{- $proxy := .Values.global.proxy | default dict -}}
{{- $trust := (.Values.global.trustBundle | default dict).configMap -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.name" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "common.name" . }}
          image: {{ include "common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.port | default 8080 }}
          env:
            - name: SERVICE_NAME
              value: {{ include "common.name" . | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | default .Chart.Version | quote }}
            - name: PORT
              value: {{ .Values.port | default 8080 | quote }}
            {{- /* Both cases: Go reads HTTP_PROXY, curl and much else read http_proxy. */}}
            {{- with $proxy.httpProxy }}
            - name: HTTP_PROXY
              value: {{ . | quote }}
            - name: http_proxy
              value: {{ . | quote }}
            {{- end }}
            {{- with $proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            - name: https_proxy
              value: {{ . | quote }}
            {{- end }}
            {{- with $proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            - name: no_proxy
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          resources:
            {{- toYaml (.Values.resources | default dict) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          {{- if $trust }}
          {{- /* readOnlyRootFilesystem is on, so this mount must be read-only too. */}}
          volumeMounts:
            - name: trust-bundle
              mountPath: /etc/ssl/certs/internal
              readOnly: true
          {{- end }}
      {{- if $trust }}
      volumes:
        - name: trust-bundle
          configMap:
            name: {{ $trust }}
      {{- end }}
{{- end -}}
