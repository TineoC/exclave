# Defaults only. Everything site-specific arrives through global.* or an override.
global:
  registry: ""
  product: acme-platform
  imagePullSecrets: []

  # The seams that differ between one platform and the next. All optional; the
  # chart renders identically when they are absent.
  routing:
    # none | ingress | gateway
    mode: none
    ingress:
      className: ""
      annotations: {}
      tlsSecret: ""
    gateway:
      name: ""
      namespace: ""
      sectionName: ""
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
  trustBundle:
    configMap: ""

image:
  repository: acme/svc
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1
port: 8080
resources: {}

route:
  # Off by default. A site turns it on, supplies a hostname, and picks a mode.
  enabled: false
  host: ""
