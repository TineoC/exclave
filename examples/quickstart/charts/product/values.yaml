# The site-values surface fits on one page. That is deliberate: if a customer has
# to understand the product's internals to install it, the contract has failed.
global:
  # Where you mirrored our images. Every image reference resolves through this.
  registry: "localhost:5001"
  product: acme-platform
  imagePullSecrets: []

  # How traffic reaches the services. none | ingress | gateway.
  # Gateway API is the portable choice where the cluster has it: platform
  # differences live in the Gateway object, not in this chart.
  routing:
    mode: none
    ingress:
      className: ""
      annotations: {}
      tlsSecret: ""
    gateway:
      name: ""
      namespace: ""
      sectionName: ""

  # Enclaves usually have both of these. Absent by default.
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
  trustBundle:
    configMap: ""

auth-svc:
  image:
    repository: acme/auth-svc
    digest: ""
    tag: "1.4.3"
  replicas: 1
  port: 8080
  route:
    enabled: false
    host: ""

billing-svc:
  image:
    repository: acme/billing-svc
    digest: ""
    tag: "2.0.1"
  replicas: 1
  port: 8080
  route:
    enabled: false
    host: ""
