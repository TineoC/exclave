name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "not formatted; run: just fmt"; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

      # The example fixtures are load-bearing: the docs quote their output.
      - name: validate catalog and fleet
        run: |
          go run ./cmd/exclave validate \
            -catalog examples/quickstart/catalog \
            -fleet examples/quickstart/fleet/environments

      - name: plan
        run: |
          go run ./cmd/exclave plan \
            -catalog examples/quickstart/catalog \
            -fleet examples/quickstart/fleet/environments

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: lint charts
        run: |
          # Depth-first: svc must vendor `common` before product packages svc.
          helm dependency update examples/quickstart/charts/svc
          helm dependency update examples/quickstart/charts/product
          helm lint examples/quickstart/charts/product

      # The contract plane is only real if the schema actually rejects things.
      - name: schema must reject invalid values
        run: |
          if helm template acme examples/quickstart/charts/product \
               --set global.registry="" >/dev/null 2>&1; then
            echo "schema accepted an empty registry; the contract is not enforced"
            exit 1
          fi
          echo "schema correctly rejected an empty registry"
