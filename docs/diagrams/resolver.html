<div class="frame">
  <p class="eyebrow">Flowchart · Resolver</p>
  <h1>One release, one environment, five checks</h1>
  <p class="sub">Every check reports a reason whether it passes or fails. A failed channel check is different in kind: the environment was never going to consider that release, so saying so would bury the blockers it can actually act on.</p>

<svg viewBox="0 0 1280 720" role="img" aria-labelledby="resolver-title resolver-desc" xmlns="http://www.w3.org/2000/svg">
<title id="resolver-title">How the resolver decides whether a release may be installed in an environment</title>
<desc id="resolver-desc">A release is tested against an environment through five checks in order: channel, schema floor, Kubernetes version range, upgrade path from the currently installed version, and tier and classification lists. Passing all five makes the release eligible. Failing the schema, Kubernetes, upgrade-path, or tier check reports the release as blocked with that reason. Failing the channel check instead marks the release out of channel, which is deliberately not reported as a blocker.</desc>
