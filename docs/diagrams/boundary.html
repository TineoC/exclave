<div class="frame">
  <p class="eyebrow">Architecture · Secure paved road</p>
  <h1>The boundary sits inside your promotion path</h1>
  <p class="sub">A single dev → staging → prod chain assumes one network. When production is in an enclave you cannot reach, it is not. You get two pipelines and a package handoff.</p>

<svg viewBox="0 0 1280 720" role="img" aria-labelledby="boundary-title boundary-desc" xmlns="http://www.w3.org/2000/svg">
<title id="boundary-title">The boundary between a vendor's build side and a customer-controlled enclave</title>
<desc id="boundary-desc">A signed bundle is the only thing that crosses from the vendor's low side, where source is committed, built, signed and published to a registry, into the customer-controlled high side, where it is imported to a mirror registry and pulled by a reconciliation agent into the cluster. A direct-apply path from the build system into the cluster is blocked at the boundary.</desc>
